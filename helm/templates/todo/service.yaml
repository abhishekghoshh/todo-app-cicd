apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-app-chart.fullname" . }}-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.deployment.app.port }}
      targetPort: http
      protocol: TCP
  selector:
    app: {{ include "todo-app-chart.fullname" . }}