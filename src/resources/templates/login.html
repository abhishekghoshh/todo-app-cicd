<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        body { font-family: sans-serif; display: grid; place-items: center; min-height: 50vh; background-color: #f4f4f4; }
        form { background: #fff; border: 1px solid #ccc; padding: 25px; border-radius: 8px; }
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 300px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <form hx-post="/login">
        <h2>Todo App Login</h2>
        <div>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="admin" required>
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" value="admin-password" required>
        </div>
        <button type="submit">Login</button>
    </form>
</body>
</html>
