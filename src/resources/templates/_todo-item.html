<div id="todo-{{.ID.Hex}}" class="todo-item">
    <h3>{{.Title}}</h3>
    <p>{{.Content}}</p>
    {{if .ImagePath}}
        <img src="/uploads/{{.ImagePath}}" alt="{{.Title}}">
    {{end}}
    
    <div class="todo-controls">
        <button class="btn-edit"
                hx-get="/todos/{{.ID.Hex}}/edit"
                hx-target="#todo-{{.ID.Hex}}"
                hx-swap="outerHTML">
            Edit
        </button>
        <button class="btn-delete"
                hx-delete="/todos/{{.ID.Hex}}"
                hx-target="#todo-{{.ID.Hex}}"
                hx-swap="outerHTML"
                hx-confirm="Are you sure you want to delete this todo?">
            Delete
        </button>
    </div>
</div>
