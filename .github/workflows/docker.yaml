# This workflow builds and pushes a Docker image to Docker Hub
name: Build and Push Todo App Docker Image

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on: 
  # workflow_dispatch: {}
  push:
    branches: ["feature"]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/docker.yaml'
      - 'go.mod'
      - 'go.sum'
      - 'version'
  # pull_request:
  #   branches: ["dev", "uat", "prod"]


jobs:
  publish_images:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.APP_IMAGE_NAME }}
      # IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Setup manual ENV
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

          # take the version from version file
          VERSION=$(cat version)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image for todo-app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:cache,mode=max
      - name: Update image tag in Helm values.yaml
        run: echo "${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ env.IMAGE_TAG }}"


