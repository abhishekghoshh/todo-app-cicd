site_name: Todo App CI/CD Pipeline
site_description: A comprehensive GitOps-powered CI/CD pipeline for a modern Go-based Todo application
site_author: Abhishek Ghosh
site_url: https://abhishekghoshh.github.io/todo-app-cicd

repo_name: abhishekghoshh/todo-app-cicd
repo_url: https://github.com/abhishekghoshh/todo-app-cicd
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline 
        name: Switch to dark mode
      primary: teal
      accent: purple 
    - scheme: slate 
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode    
      primary: teal
      accent: lime

