# This workflow builds and pushes a Docker image to Docker Hub
name: Build and Push Sandbox Image

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on: 
  # workflow_dispatch: {}
  push:
    branches: ["feature"]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/docker.yaml'
      - 'go.mod'
      - 'go.sum'
  # pull_request:
  #   branches: ["dev", "uat", "prod"]


jobs:
  publish_images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image for todo-app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/todo-app:latest
            ${{ vars.DOCKERHUB_USERNAME }}/todo-app:${{ github.sha }}
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:cache
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:cache,mode=max
      - name: Update image tag in Helm values.yaml
        run: echo "${{ vars.DOCKERHUB_USERNAME }}/todo-app:${{ github.sha }}"



